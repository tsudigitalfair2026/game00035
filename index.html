<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>パンダシューティングDX</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:sans-serif;
    background:#dff6ff;
}
.screen{
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}
.active{
    display:flex;
}
h1{
    margin-bottom:15px;
}
p{
    margin:6px 0;
    line-height:1.6;
}
button{
    min-width:200px;
    min-height:60px;
    font-size:1.2rem;
    border:none;
    border-radius:14px;
    background:#28a745;
    color:white;
    margin-top:20px;
}
#gameScreen{
    padding:0;
    justify-content:flex-start;
}
#hud{
    width:100%;
    height:60px;
    background:#114b5f;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-weight:bold;
}
#gameArea{
    position:relative;
    flex:1;
    width:100%;
    overflow:hidden;
    background:linear-gradient(#87ceeb,#e8ffff);
    touch-action:none;
}
.player{
    position:absolute;
    font-size:52px;
    user-select:none;
}
.enemy{
    position:absolute;
    font-size:40px;
    user-select:none;
}
.bullet{
    position:absolute;
    width:8px;
    height:20px;
    border-radius:10px;
    background:#ff3b30;
}
.star{
    position:absolute;
    font-size:36px;
    user-select:none;
}
.invincible{
    filter:drop-shadow(0 0 10px gold);
}
#rank{
    font-size:2rem;
    margin-top:15px;
    color:#ff6b00;
    font-weight:bold;
}
#message{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,215,0,0.9);
    color:#000;
    padding:10px 18px;
    border-radius:20px;
    font-weight:bold;
    display:none;
    z-index:100;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
    <h1>🐼 パンダシューティングDX</h1>
    <p>左右に動いて敵をやっつけよう！</p>
    <p>途中で出る⭐無敵スターを取ると</p>
    <p>8秒間無敵になるよ！</p>
    <p>制限時間60秒！</p>
    <button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen">
    <div id="hud">
        <div>スコア: <span id="score">0</span></div>
        <div>残り: <span id="time">60</span>秒</div>
    </div>
    <div id="gameArea">
        <div id="message">⭐ 無敵モード！ ⭐</div>
    </div>
</div>

<div id="resultScreen" class="screen">
    <h1>結果発表</h1>
    <p style="font-size:1.5rem;">
        最終スコア:
        <span id="finalScore">0</span>
    </p>
    <div id="rank">C</div>
    <button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");
const gameArea=document.getElementById("gameArea");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScoreEl=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");
const messageEl=document.getElementById("message");

let player;
let score=0;
let timeLeft=60;

let bullets=[];
let enemies=[];
let stars=[];

let gameRunning=false;
let invincible=false;

let gameLoop;
let timerLoop;
let enemyLoop;
let shootLoop;
let starLoop;

function showScreen(screen){
    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });
    screen.classList.add("active");
}

function createPlayer(){
    player=document.createElement("div");
    player.className="player";
    player.textContent="🐼";

    player.x=gameArea.clientWidth/2-25;
    player.y=gameArea.clientHeight-90;

    updatePlayer();

    gameArea.appendChild(player);
}

function updatePlayer(){
    player.style.left=player.x+"px";
    player.style.top=player.y+"px";
}

function shoot(){
    if(!gameRunning)return;

    const bullet=document.createElement("div");
    bullet.className="bullet";

    bullet.x=player.x+24;
    bullet.y=player.y;

    bullet.style.left=bullet.x+"px";
    bullet.style.top=bullet.y+"px";

    gameArea.appendChild(bullet);
    bullets.push(bullet);
}

function spawnEnemy(){
    if(!gameRunning)return;

    const enemy=document.createElement("div");
    enemy.className="enemy";

    const list=["👾","🦝","🐗","🎈"];
    enemy.textContent=list[Math.floor(Math.random()*list.length)];

    enemy.x=Math.random()*(gameArea.clientWidth-50);
    enemy.y=-50;
    enemy.speed=2+Math.random()*2.5;

    enemy.style.left=enemy.x+"px";
    enemy.style.top=enemy.y+"px";

    gameArea.appendChild(enemy);
    enemies.push(enemy);
}

function spawnStar(){
    if(!gameRunning)return;

    const star=document.createElement("div");
    star.className="star";
    star.textContent="⭐";

    star.x=Math.random()*(gameArea.clientWidth-50);
    star.y=-40;
    star.speed=2;

    star.style.left=star.x+"px";
    star.style.top=star.y+"px";

    gameArea.appendChild(star);
    stars.push(star);
}

function activateInvincible(){
    invincible=true;

    player.classList.add("invincible");
    messageEl.style.display="block";

    setTimeout(()=>{
        invincible=false;
        if(player){
            player.classList.remove("invincible");
        }
        messageEl.style.display="none";
    },8000);
}

function startGame(){

    score=0;
    timeLeft=60;

    bullets=[];
    enemies=[];
    stars=[];

    scoreEl.textContent=0;
    timeEl.textContent=60;

    gameArea.innerHTML='<div id="message">⭐ 無敵モード！ ⭐</div>';
    window.messageEl=document.getElementById("message");

    showScreen(gameScreen);

    createPlayer();

    gameRunning=true;
    invincible=false;

    shootLoop=setInterval(shoot,250);
    enemyLoop=setInterval(spawnEnemy,700);

    starLoop=setInterval(()=>{
        if(Math.random()<0.7){
            spawnStar();
        }
    },12000);

    timerLoop=setInterval(()=>{
        timeLeft--;
        timeEl.textContent=timeLeft;

        if(timeLeft<=0){
            endGame();
        }
    },1000);

    update();
}

function update(){

    if(!gameRunning)return;

    for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];

        b.y-=8;
        b.style.top=b.y+"px";

        if(b.y<-30){
            b.remove();
            bullets.splice(i,1);
        }
    }

    for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i];

        e.y+=e.speed;
        e.style.top=e.y+"px";

        if(
            player &&
            e.x < player.x+45 &&
            e.x+40 > player.x &&
            e.y < player.y+45 &&
            e.y+40 > player.y
        ){
            if(invincible){
                score+=20;
                scoreEl.textContent=score;

                e.remove();
                enemies.splice(i,1);
                continue;
            }else{
                endGame();
                return;
            }
        }

        if(e.y>gameArea.clientHeight+50){
            e.remove();
            enemies.splice(i,1);
            continue;
        }

        for(let j=bullets.length-1;j>=0;j--){

            const b=bullets[j];

            if(
                b.x < e.x+40 &&
                b.x+8 > e.x &&
                b.y < e.y+40 &&
                b.y+20 > e.y
            ){
                score+=10;
                scoreEl.textContent=score;

                e.remove();
                b.remove();

                enemies.splice(i,1);
                bullets.splice(j,1);
                break;
            }
        }
    }

    for(let i=stars.length-1;i>=0;i--){

        const s=stars[i];

        s.y+=s.speed;
        s.style.top=s.y+"px";

        if(
            player &&
            s.x < player.x+50 &&
            s.x+35 > player.x &&
            s.y < player.y+50 &&
            s.y+35 > player.y
        ){
            activateInvincible();

            s.remove();
            stars.splice(i,1);
            continue;
        }

        if(s.y>gameArea.clientHeight){
            s.remove();
            stars.splice(i,1);
        }
    }

    gameLoop=requestAnimationFrame(update);
}

function endGame(){

    if(!gameRunning)return;

    gameRunning=false;

    clearInterval(timerLoop);
    clearInterval(enemyLoop);
    clearInterval(shootLoop);
    clearInterval(starLoop);

    cancelAnimationFrame(gameLoop);

    finalScoreEl.textContent=score;

    let rank="C";

    if(score>=900){
        rank="S";
    }else if(score>=600){
        rank="A";
    }else if(score>=300){
        rank="B";
    }

    rankEl.textContent=rank;

    showScreen(resultScreen);
}

function movePlayer(clientX){

    if(!player || !gameRunning)return;

    const rect=gameArea.getBoundingClientRect();

    let x=clientX-rect.left-25;

    if(x<0)x=0;
    if(x>rect.width-50)x=rect.width-50;

    player.x=x;
    updatePlayer();
}

gameArea.addEventListener("pointerdown",e=>{
    movePlayer(e.clientX);
});

gameArea.addEventListener("pointermove",e=>{
    if(e.pointerType==="touch" || e.buttons){
        movePlayer(e.clientX);
    }
});

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);

document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
</script>

</body>
</html>
